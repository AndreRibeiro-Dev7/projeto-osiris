name: Production uptime monitor

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Escolha o tipo de verificacao"
        required: true
        default: health-check
        type: choice
        options:
          - health-check
          - simulate-failure

concurrency:
  group: production-uptime-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  BASE_URL: https://osiris-api-5ujk.onrender.com
  INCIDENT_TITLE: "[Monitoramento] Osiris indisponivel"
  MAX_RESPONSE_TIME_SECONDS: "90"
  MONITOR_MODE: ${{ inputs.run_mode || 'health-check' }}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check API and database
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set +e
          report="$RUNNER_TEMP/health-report.txt"
          : > "$report"

          check_endpoint() {
            label="$1"
            url="$2"
            body_file="$RUNNER_TEMP/health-body.txt"
            error_file="$RUNNER_TEMP/health-error.txt"
            for attempt in 1 2; do
              : > "$body_file"
              : > "$error_file"
              response="$(curl \
              --silent \
              --show-error \
              --fail-with-body \
              --location \
              --max-time 120 \
              --output "$body_file" \
              --write-out $'\n%{http_code}\n%{time_total}' \
              "$url" 2>"$error_file")"
              curl_status=$?
              if [ "$curl_status" -eq 0 ] || [ "$attempt" -eq 2 ]; then
                break
              fi
              sleep 15
            done
            http_status="$(printf '%s\n' "$response" | tail -n 2 | head -n 1)"
            elapsed_seconds="$(printf '%s\n' "$response" | tail -n 1)"
            body="$(cat "$body_file")"

            printf '%s' "$body" | python -c \
              'import json, sys; data = json.load(sys.stdin); raise SystemExit(0 if data.get("status") == "ok" else 1)' \
              >/dev/null 2>&1
            body_status=$?

            python - "$elapsed_seconds" "$MAX_RESPONSE_TIME_SECONDS" <<'PY'
          import sys

          try:
              elapsed = float(sys.argv[1])
              limit = float(sys.argv[2])
          except ValueError:
              raise SystemExit(1)
          raise SystemExit(0 if elapsed <= limit else 1)
          PY
            latency_status=$?

            if [ "$curl_status" -eq 0 ] && [ "$http_status" = "200" ] && \
              [ "$body_status" -eq 0 ] && [ "$latency_status" -eq 0 ]; then
              echo "$label: saudavel (HTTP $http_status, ${elapsed_seconds}s)" >> "$report"
              return 0
            fi

            echo "$label: falha (curl=$curl_status, HTTP=$http_status, tempo=${elapsed_seconds}s, limite=${MAX_RESPONSE_TIME_SECONDS}s, resposta=${body:0:300})" >> "$report"
            return 1
          }

          api_ok=false
          database_ok=false
          echo "Modo da execucao: $MONITOR_MODE" | tee -a "$report"
          if [ "$MONITOR_MODE" = "simulate-failure" ]; then
            echo "Falha controlada solicitada manualmente; a producao nao foi interrompida." >> "$report"
          else
            check_endpoint "API" "$BASE_URL/api/v1/health" && api_ok=true
            check_endpoint "Banco" "$BASE_URL/api/v1/health/database" && database_ok=true
          fi

          if [ "$api_ok" = true ] && [ "$database_ok" = true ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "report<<OSIRIS_REPORT"
            cat "$report"
            echo "OSIRIS_REPORT"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Monitoramento de producao"
            echo
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open incident on failure
        if: steps.health.outputs.healthy != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPORT: ${{ steps.health.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing_issue="$(gh issue list \
            --repo "$GH_REPO" \
            --state open \
            --search "$INCIDENT_TITLE in:title" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$existing_issue" ]; then
            body="Falha detectada pelo monitor automatico de producao.

            $REPORT

            Execucao: $RUN_URL
            Data UTC: $(date -u +'%Y-%m-%d %H:%M:%S')"
            gh issue create \
              --repo "$GH_REPO" \
              --title "$INCIDENT_TITLE" \
              --body "$body" \
              --assignee "$REPOSITORY_OWNER"
          fi

      - name: Close incident after recovery
        if: steps.health.outputs.healthy == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing_issue="$(gh issue list \
            --repo "$GH_REPO" \
            --state open \
            --search "$INCIDENT_TITLE in:title" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing_issue" ]; then
            gh issue close "$existing_issue" \
              --repo "$GH_REPO" \
              --comment "Servico recuperado e validado automaticamente. Execucao: $RUN_URL"
          fi

      - name: Fail workflow when production is unavailable
        if: steps.health.outputs.healthy != 'true'
        env:
          REPORT: ${{ steps.health.outputs.report }}
        run: |
          printf '%s\n' "$REPORT"
          exit 1
