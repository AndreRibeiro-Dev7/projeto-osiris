name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  booking-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate booking dialog on mobile and desktop
        run: node --test scripts/test_booking_dialog.cjs

  tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: osiris_isolation_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credentials belong only to the disposable CI service, never production.
      DATABASE_URL: postgresql+asyncpg://postgres:isolated-ci-password@127.0.0.1:5432/osiris_isolation_test_ci
      OSIRIS_INTEGRATION_DATABASE_URL: postgresql+asyncpg://postgres:isolated-ci-password@127.0.0.1:5432/osiris_isolation_test_ci
      JWT_SECRET_KEY: isolated-ci-signing-key-not-used-in-any-deployment
      ENVIRONMENT: development
      API_V1_PREFIX: /api/v1
      DEBUG: "false"
      LOG_LEVEL: WARNING
      OWNER_BOOTSTRAP_ENABLED: "false"
      EMAIL_DELIVERY_ENABLED: "false"
      DISCORD_ALERT_WEBHOOK_URL: ""
      OPENAI_API_KEY: ""
      RESEND_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Apply migrations to isolated PostgreSQL
        run: alembic upgrade head
      - name: Validate tenants, public booking and assistant workflow
        run: pytest tests/integration -p no:cacheprovider

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: black --check .
      - name: Type check
        run: mypy app
      - name: Tests
        run: pytest
