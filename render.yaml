services:
  - type: web
    name: osiris-api
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/database
    envVars:
      - key: APP_NAME
        value: Projeto Osiris
      - key: APP_VERSION
        value: 0.1.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_ECHO
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: osiris-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OWNER_BOOTSTRAP_TOKEN
        generateValue: true
      - key: OWNER_BOOTSTRAP_ENABLED
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: EMAIL_DELIVERY_ENABLED
        value: "true"
      - key: SEED_DEMO_HISTORY
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

databases:
  - name: osiris-db
    region: virginia
    plan: free
    databaseName: osiris
    user: osiris
    postgresMajorVersion: "16"
    ipAllowList: []
